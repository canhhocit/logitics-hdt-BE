spring:
  config:
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  application:
    name: hdtlogistics-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hdtlogistics}}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:aGRsb2dpc3RpY3Nfc3VwZXJfc2VjcmV0X2tleV9uZWVkc190b19iZV9sb25nX2Vub3VnaF9mb3JfaG1hY19zaGEyNTY=}
  expiration: 86400000 # 24 hours
  refresh-expiration: 2592000000 # 30 days
